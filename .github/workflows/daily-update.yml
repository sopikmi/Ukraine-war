name: Denní aktualizace SITREP
on:
  schedule:
    - cron: "17 4 * * *"   # ~6:17 SELČ / 5:17 SEČ
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Aktualizace dat
        id: upd
        continue-on-error: true
        run: python scripts/auto_update.py 2> scripts/last_run.log
      - name: Komentovaný text (Claude API)
        id: ai
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_daily.py 2> scripts/last_ai.log
      - name: Commit a push
        run: |
          git add scripts/last_run.log scripts/last_ai.log || true
          if ! git diff --cached --quiet || ! git diff --quiet; then
            git config user.name "sitrep-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -m "Automatická aktualizace $(TZ=Europe/Prague date +%F)"
            git push
          fi
      - name: Selhání zdroje
        if: steps.upd.outcome == 'failure' || steps.ai.outcome == 'failure'
        run: exit 1
